<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>NOVERA Admin</title>
<style>
:root{color-scheme:dark;--bg:#090a0c;--panel:#111318;--line:#292c33;--text:#f5f1e8;--muted:#9da1aa;--gold:#caa85e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}.wrap{max-width:1200px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:20px;margin-bottom:24px}.brand{letter-spacing:5px;font-weight:800}.eyebrow{font-size:11px;letter-spacing:2px;color:var(--gold)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px}.login{max-width:430px;margin:10vh auto}.field{margin:14px 0}.field label{display:block;color:var(--muted);font-size:13px;margin-bottom:6px}.field input,.field select{width:100%;background:#0b0c0f;border:1px solid var(--line);color:var(--text);border-radius:9px;padding:12px}.primary{background:var(--gold);color:#090a0c;border:0;border-radius:9px;padding:12px 16px;font-weight:800}.ghost{background:transparent;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:10px 14px}.error{color:#ff8f8f;margin-top:12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}.stat strong{font-size:28px;display:block}.stat span{color:var(--muted)}.section{margin-top:20px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{text-align:left;border-bottom:1px solid var(--line);padding:12px 8px;vertical-align:top}.table th{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:1px}.badge{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:3px 8px;font-size:12px}.row-actions{display:flex;gap:6px;align-items:center}.stock-input{width:80px;background:#0b0c0f;color:var(--text);border:1px solid var(--line);padding:7px;border-radius:7px}.muted{color:var(--muted)}@media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}.wrap{padding:15px}.top{align-items:flex-start;gap:12px}.top .brand{font-size:14px}}
</style></head>
<body>
<div id="login" class="wrap"><div class="panel login"><div class="eyebrow">NOVERA / PRIVATE AREA</div><h1>Admin Login</h1><p class="muted">Authorized administrators only.</p><form id="loginForm"><div class="field"><label>Email</label><input id="email" type="email" autocomplete="username" value="Volkeno93@gmail.com" required></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" required></div><button class="primary" style="width:100%">SIGN IN</button><div id="loginError" class="error"></div></form></div></div>
<div id="app" class="wrap hidden"><header class="top"><div><div class="eyebrow">NOVERA / CONTROL CENTER</div><div class="brand">NOVERA ADMIN</div></div><button id="logout" class="ghost">LOG OUT</button></header>
<div class="grid"><div class="panel stat"><strong id="statOrders">—</strong><span>Total orders</span></div><div class="panel stat"><strong id="statPaid">—</strong><span>Paid orders</span></div><div class="panel stat"><strong id="statRevenue">—</strong><span>Revenue / BHD</span></div><div class="panel stat"><strong id="statUnits">—</strong><span>Units sold</span></div></div>
<section class="section panel"><div class="eyebrow">INVENTORY</div><h2>Products & stock</h2><div class="table-wrap"><table class="table"><thead><tr><th>Product</th><th>Price</th><th>Stock</th><th>Reserved</th><th>Action</th></tr></thead><tbody id="products"></tbody></table></div></section>
<section class="section panel"><div class="eyebrow">ORDERS</div><h2>Recent orders</h2><div class="table-wrap"><table class="table"><thead><tr><th>Order</th><th>Customer</th><th>Total</th><th>Payment</th><th>Status</th><th>Action</th></tr></thead><tbody id="orders"></tbody></table></div></section>
</div>
<script>
const $=s=>document.querySelector(s);const money=n=>Number(n||0).toFixed(3);const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
async function api(url,options={}){const r=await fetch(url,{credentials:'same-origin',...options,headers:{'Content-Type':'application/json',...(options.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Request failed');return d}
function showApp(){ $('#login').classList.add('hidden');$('#app').classList.remove('hidden');load(); }
async function load(){try{const d=await api('/api/admin?action=dashboard');$('#statOrders').textContent=d.stats.orders;$('#statPaid').textContent=d.stats.paidOrders;$('#statRevenue').textContent=money(d.stats.revenue);$('#statUnits').textContent=d.stats.units;
$('#products').innerHTML=d.products.map(p=>{const i=(p.inventory||[])[0]||{};return `<tr><td><strong>${esc(p.name)}</strong><br><span class="muted">${esc(p.slug)}</span></td><td>${money(p.price)}</td><td><input class="stock-input" type="number" min="0" value="${Number(i.stock||0)}" data-stock="${p.id}"></td><td>${Number(i.reserved_quantity||0)}</td><td><button class="ghost" data-save-stock="${p.id}">SAVE</button></td></tr>`}).join('')||'<tr><td colspan="5">No products</td></tr>';
$('#orders').innerHTML=d.orders.map(o=>`<tr><td><strong>${esc(o.order_number)}</strong><br><span class="muted">${new Date(o.created_at).toLocaleString()}</span></td><td>${esc(o.customer_name)}<br><span class="muted">${esc(o.email)}</span></td><td>${money(o.total)} BHD</td><td><span class="badge">${esc(o.payment_status)}</span></td><td><select data-order-status="${o.id}">${['pending','paid','processing','shipped','delivered','cancelled','refunded'].map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select></td><td><button class="ghost" data-save-order="${o.id}">UPDATE</button></td></tr>`).join('')||'<tr><td colspan="6">No orders yet</td></tr>';
}catch(e){if(/auth|session|administrator/i.test(e.message)){location.reload()}else alert(e.message)}}
$('#loginForm').addEventListener('submit',async e=>{e.preventDefault();$('#loginError').textContent='';try{await api('/api/admin?action=login',{method:'POST',body:JSON.stringify({email:$('#email').value,password:$('#password').value})});$('#password').value='';showApp()}catch(e){$('#loginError').textContent=e.message}});
$('#logout').onclick=async()=>{await api('/api/admin?action=logout',{method:'POST'});location.reload()};
document.addEventListener('click',async e=>{const s=e.target.closest('[data-save-stock]');if(s){const id=s.dataset.saveStock;const input=document.querySelector(`[data-stock="${id}"]`);try{await api('/api/admin?action=inventory',{method:'PATCH',body:JSON.stringify({productId:id,stock:Number(input.value)})});await load()}catch(err){alert(err.message)}}const o=e.target.closest('[data-save-order]');if(o){const id=o.dataset.saveOrder;const status=document.querySelector(`[data-order-status="${id}"]`).value;try{await api('/api/admin?action=order',{method:'PATCH',body:JSON.stringify({orderId:id,status})});await load()}catch(err){alert(err.message)}}});
(async()=>{try{await api('/api/admin?action=dashboard');showApp()}catch(_){}})();
</script></body></html>
