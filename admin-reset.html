<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>NOVERA — Reset Admin Password</title><style>:root{color-scheme:dark;--bg:#090a0c;--panel:#111318;--line:#292c33;--text:#f5f1e8;--muted:#9da1aa;--gold:#caa85e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,sans-serif}.wrap{max-width:430px;margin:10vh auto;padding:24px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px}.eyebrow{font-size:11px;letter-spacing:2px;color:var(--gold)}h1{font-size:38px;margin:10px 0}.muted{color:var(--muted)}.field{margin:18px 0}.field label{display:block;color:var(--muted);margin-bottom:7px}.field input{width:100%;background:#0b0c0f;border:1px solid var(--line);color:var(--text);border-radius:9px;padding:13px;font:inherit}.primary{width:100%;background:var(--gold);color:#090a0c;border:0;border-radius:9px;padding:13px;font-weight:800}.error{color:#ff8f8f;margin-top:12px}.ok{color:#9be7b2;margin-top:12px}</style></head><body><main class="wrap"><div class="panel"><div class="eyebrow">NOVERA / PRIVATE AREA</div><h1>Set new password</h1><p class="muted">Create a new password for the NOVERA administrator account.</p><form id="form"><div class="field"><label>New password</label><input id="password" type="password" minlength="10" autocomplete="new-password" required></div><div class="field"><label>Confirm password</label><input id="confirm" type="password" minlength="10" autocomplete="new-password" required></div><button class="primary">UPDATE PASSWORD</button><div id="message"></div></form></div></main><script>const form=document.getElementById('form'),msg=document.getElementById('message');const params=new URLSearchParams(location.hash.replace(/^#/,'').replace(/^\?/,'').replace(/&/g,'&'));const token=params.get('access_token');form.addEventListener('submit',async e=>{e.preventDefault();msg.className='';msg.textContent='';const p=document.getElementById('password').value,c=document.getElementById('confirm').value;if(p.length<10){msg.className='error';msg.textContent='Use at least 10 characters.';return}if(p!==c){msg.className='error';msg.textContent='Passwords do not match.';return}if(!token){msg.className='error';msg.textContent='This reset link is invalid or expired. Request a new one.';return}try{const r=await fetch('/api/admin?action=reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({accessToken:token,password:p})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Unable to reset password');msg.className='ok';msg.textContent='Password updated. Redirecting to admin login…';setTimeout(()=>location.href='/admin.html',900)}catch(err){msg.className='error';msg.textContent=err.message}});</script></body></html>
