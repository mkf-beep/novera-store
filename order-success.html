<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="description" content="NOVERA order confirmation."><title>NOVERA / Order Confirmed</title>
<link rel="stylesheet" href="style.css"><link rel="stylesheet" href="mobile-fixes.css"><link rel="stylesheet" href="cart-checkout-polish.css"><link rel="icon" href="images/novera-logo.png">
<style>
.success-page{max-width:900px;margin:0 auto;padding:90px 24px 120px;text-align:center}.success-mark{width:72px;height:72px;margin:0 auto 30px;border:1px solid var(--gold);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--gold2);font-size:28px}.success-label{color:var(--gold);font-size:10px;font-weight:700;letter-spacing:3px}.success-page h1{font-size:clamp(52px,8vw,100px);line-height:.85;letter-spacing:-5px;margin:18px 0 24px}.success-page h1 em{font-style:normal;color:var(--gold)}.success-page>p{max-width:560px;margin:0 auto;color:#888;font-size:14px;line-height:1.8}.order-card{max-width:620px;margin:48px auto 0;padding:28px;border:1px solid rgba(198,160,82,.35);background:linear-gradient(145deg,#111217,#080808);text-align:left}.order-card>span{color:var(--gold);font-size:9px;letter-spacing:2px}.order-number{display:flex;justify-content:space-between;gap:20px;align-items:center;padding:18px 0;border-bottom:1px solid #292a2e}.order-number strong{color:var(--gold2);font-size:18px;letter-spacing:1px}.success-actions{display:flex;justify-content:center;gap:14px;margin-top:32px;flex-wrap:wrap}.success-actions a{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:0 24px;font-size:9px;font-weight:800;letter-spacing:2px;text-transform:uppercase}.success-primary{background:var(--gold);color:#050505}.success-secondary{border:1px solid rgba(198,160,82,.35);color:var(--gold2)}@media(max-width:600px){.success-page{padding:65px 18px 90px}.order-card{padding:22px}.success-page h1{font-size:58px}.success-actions a{width:100%}}
</style>
</head>
<body>
<header class="site-header"><a href="index.html" class="logo">NOVERA</a><nav class="main-nav"><a href="index.html">Home</a><a href="collection.html">Collection</a><a href="about.html">About</a><a href="contact.html">Contact</a><a href="cart.html">Cart</a></nav></header>
<main class="success-page"><div class="success-mark">✓</div><span class="success-label">NOVERA / ORDER CONFIRMED</span><h1>THANK <em>YOU.</em></h1><p>Your order has been received successfully. A confirmation will be sent to the email address provided at checkout.</p><div class="order-card"><span>ORDER REFERENCE</span><div class="order-number"><strong id="order-number">NVR-000000</strong><span>CONFIRMED</span></div></div><div class="success-actions"><a class="success-primary" href="collection.html">CONTINUE SHOPPING</a><a class="success-secondary" href="index.html">BACK TO HOME</a></div></main>
<script>document.addEventListener('DOMContentLoaded',()=>{const key='novera_order_number';let n=localStorage.getItem(key);if(!n){n='NVR-'+Date.now().toString().slice(-6);localStorage.setItem(key,n)}document.getElementById('order-number').textContent=n;});</script>
</body></html>
