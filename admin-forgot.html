<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>NOVERA — Reset Admin Password</title><style>:root{color-scheme:dark;--bg:#090a0c;--panel:#111318;--line:#292c33;--text:#f5f1e8;--muted:#9da1aa;--gold:#caa85e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,sans-serif}.wrap{max-width:430px;margin:10vh auto;padding:24px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px}.eyebrow{font-size:11px;letter-spacing:2px;color:var(--gold)}h1{font-size:38px;margin:10px 0}.muted{color:var(--muted)}input{width:100%;background:#0b0c0f;border:1px solid var(--line);color:var(--text);border-radius:9px;padding:13px;font:inherit;margin:8px 0 18px}.primary{width:100%;background:var(--gold);color:#090a0c;border:0;border-radius:9px;padding:13px;font-weight:800}.error{color:#ff8f8f;margin-top:12px}.ok{color:#9be7b2;margin-top:12px}a{color:var(--gold)}</style></head><body><main class="wrap"><div class="panel"><div class="eyebrow">NOVERA / PRIVATE AREA</div><h1>Reset password</h1><p class="muted">A secure reset link will be sent to the NOVERA administrator email.</p><form id="form"><label class="muted">Admin email</label><input id="email" type="email" value="Volkeno93@gmail.com" autocomplete="email" required><button class="primary">SEND RESET LINK</button><div id="message"></div></form></div></main><script>const form=document.getElementById('form'),msg=document.getElementById('message');form.addEventListener('submit',async e=>{e.preventDefault();msg.className='';msg.textContent='Sending…';try{const r=await fetch('/api/admin?action=request-reset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Unable to send reset email');msg.className='ok';msg.textContent='Reset email sent. Check your inbox and use the newest message.'}catch(err){msg.className='error';msg.textContent=err.message}});</script></body></html>
